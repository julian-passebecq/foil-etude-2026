name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  streamlit-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m py_compile app.py study_model.py study_content.py reader_sections.py
      - run: python -m pytest -q
